services:
  db:
    image: postgres:16-alpine
    container_name: neuralflow-db-local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: neuralflow
      POSTGRES_PASSWORD: neuralflow123
      POSTGRES_DB: neuralflow
    volumes:
      - pgdata_local:/var/lib/postgresql/data

volumes:
  pgdata_local:
